services:
  db:
    image: mysql:8.0
    container_name: simproyek_db
    restart: unless-stopped
    # Kolasi case-insensitive (setara ILIKE PostgreSQL) + dukungan emoji/Unicode penuh.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_ai}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      TZ: UTC
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  ml:
    build: ./ml
    container_name: simproyek_ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    container_name: simproyek_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-ganti-rahasia-ini-di-produksi}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_NAME: ${MYSQL_DATABASE:-project_ai}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # URL layanan Machine Learning untuk analisis risiko (v2).
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8000}
      # Data demo nonaktif secara bawaan; aplikasi dipakai dengan data nyata.
      SEED_DEMO: ${SEED_DEMO:-false}
      # Akun admin pertama dibuat otomatis bila belum ada pengguna.
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      # Aktifkan (true) hanya bila diakses via HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: simproyek_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysqldata:
